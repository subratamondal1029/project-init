name: Publish to npm

on:
  push:
    branches:
      - test/ci-release-job

jobs:
  version_check:
    name: Check Version Changed
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Compare versions
        id: check
        run: |
          LOCAL=$(node -p "require('./package.json').version")
          REMOTE=$(npm view @subratamondal/project-init version 2>/dev/null || echo "0.0.0")
          if [ "$LOCAL" = "$REMOTE" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Version has not changed."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "version=$LOCAL" >> $GITHUB_OUTPUT
            echo "Version has changed $REMOTE to $LOCAL"
          fi

  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    needs: version_check
    if: needs.version_check.outputs.skip == 'false'
    steps:
      - run: echo "pass code quality checks"

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    needs: [version_check, quality]
    if: needs.version_check.outputs.skip == 'false'
    steps:
      - run: echo "Published to npm"

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [version_check, quality, publish]
    if: needs.version_check.outputs.skip == 'false'
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version_check.outputs.version }}
          name: v${{ needs.version_check.outputs.version }}
          body: "This is a new version (v${{ needs.version_check.outputs.version }})"
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
